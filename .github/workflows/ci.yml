name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Minimal permissions for security
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.1'

jobs:
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Lint frontend code
        working-directory: ./frontend
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd frontend && npm run lint
          
      - name: Run frontend tests (if available)
        working-directory: ./frontend
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd frontend && npm test --if-present
          
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: pingme_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, iconv, json, mbstring, pdo
          coverage: none
          
      - name: Copy environment file
        working-directory: ./backend
        run: cp .env.example .env
        
      - name: Install backend dependencies
        working-directory: ./backend
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: cd backend && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          
      - name: Generate application key
        working-directory: ./backend
        run: php artisan key:generate
        
      - name: Set up database
        working-directory: ./backend
        run: |
          php artisan config:clear
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pingme_test
          DB_USERNAME: root
          DB_PASSWORD: password
          
      - name: Run backend tests
        working-directory: ./backend
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd backend && vendor/bin/phpunit --testdox
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pingme_test
          DB_USERNAME: root
          DB_PASSWORD: password

  notify:
    name: Email Notification
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()
    
    steps:
      - name: Send success notification
        if: ${{ needs.frontend.result == 'success' && needs.backend.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration - these secrets must be set in repository settings:
          # SMTP_SERVER: SMTP server hostname (e.g., smtp.gmail.com)
          # SMTP_PORT: SMTP server port (e.g., 587 for TLS, 465 for SSL)
          # SMTP_USERNAME: SMTP username/email for authentication
          # SMTP_PASSWORD: SMTP password or app-specific password
          # MAINTAINER_EMAIL: Email address to send notifications to
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ PingMe CI: Build Successful - ${{ github.ref_name }}"
          to: ${{ secrets.MAINTAINER_EMAIL }}
          from: PingMe CI <${{ secrets.SMTP_USERNAME }}>
          body: |
            🎉 Great news! The CI pipeline has completed successfully.
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Workflow:** ${{ github.workflow }}
            **Run ID:** ${{ github.run_id }}
            
            Both frontend and backend builds passed all tests!
            
            View the full results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
    
      - name: Send failure notification
        if: ${{ needs.frontend.result == 'failure' || needs.backend.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          # SMTP server configuration - these secrets must be set in repository settings:
          # SMTP_SERVER: SMTP server hostname (e.g., smtp.gmail.com) 
          # SMTP_PORT: SMTP server port (e.g., 587 for TLS, 465 for SSL)
          # SMTP_USERNAME: SMTP username/email for authentication
          # SMTP_PASSWORD: SMTP password or app-specific password
          # MAINTAINER_EMAIL: Email address to send notifications to
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ PingMe CI: Build Failed - ${{ github.ref_name }}"
          to: ${{ secrets.MAINTAINER_EMAIL }}
          from: PingMe CI <${{ secrets.SMTP_USERNAME }}>
          body: |
            ⚠️ The CI pipeline has failed and requires attention.
            
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Author:** ${{ github.actor }}
            **Workflow:** ${{ github.workflow }}
            **Run ID:** ${{ github.run_id }}
            
            **Job Results:**
            - Frontend: ${{ needs.frontend.result }}
            - Backend: ${{ needs.backend.result }}
            
            Please check the logs and fix any issues:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}